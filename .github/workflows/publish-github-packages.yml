name: Publish to GitHub Packages

# Manual publish of a specific ref/version to this repository's GitHub Packages feed.
# Uses the built-in GITHUB_TOKEN (no extra secrets).

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to publish from, e.g. v0.1.0-preview.1 or main'
        required: true
        type: string
      version:
        description: 'Package version to publish, e.g. 0.1.0-preview.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore YooKassaNet.slnx

      - name: Build
        run: dotnet build YooKassaNet.slnx --configuration Release --no-restore -p:Version=${{ inputs.version }}

      - name: Test
        run: dotnet test tests/YooKassaNet.Tests/YooKassaNet.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/YooKassaNet/YooKassaNet.csproj
          --configuration Release
          --no-build
          --output artifacts/packages
          -p:Version=${{ inputs.version }}
          -p:PackageVersion=${{ inputs.version }}
          -p:InformationalVersion=${{ inputs.version }}

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Push to GitHub Packages
        run: dotnet nuget push artifacts/packages/*.nupkg --source github --skip-duplicate
